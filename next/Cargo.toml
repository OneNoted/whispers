[package]
name = "whispers-next"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Local intended-text dictation for Wayland"
repository = "https://github.com/OneNoted/whispers"
readme = "../README.md"
keywords = ["wayland", "speech-to-text", "dictation", "voice"]
categories = ["accessibility", "multimedia"]

[dependencies]
libc = "0.2"
libloading = "0.8"
lexopt = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
multiple_crate_versions = "allow"
must_use_candidate = "allow"
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
lto = "thin"
strip = "symbols"
