version = 2
language = "auto"

[audio]
# Empty uses the PipeWire default source.
device = ""
feedback = true

[recognition]
# The managed runtime and model installed by `whispers setup`.
runtime = "sherpa-onnx"
# Low-latency text shown in the OSD while speaking.
model = "nemotron-3.5-asr-streaming-0.6b-560ms-int8"
# Multilingual full-recording pass used for delivered text.
final_model = "nemo-parakeet-tdt-0.6b-v3-int8"
# Existing whisper.cpp model used only if managed ASR is unavailable.
fallback_model = "ggml-large-v3-turbo.bin"

[enhancement]
enabled = true
# "managed" uses the checksum-pinned llama.cpp runtime from setup.
command = "managed"
model = "Qwen_Qwen3.5-4B-Q4_K_M.gguf"
timeout_ms = 10000
