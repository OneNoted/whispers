version = 2
language = "auto"

[audio]
# Empty uses the PipeWire default source.
device = ""
feedback = true

[recognition]
# The managed runtime and model installed by `whispers setup`.
runtime = "sherpa-onnx"
model = "nemotron-3.5-asr-streaming-0.6b-560ms-int8"
# Existing whisper.cpp model used only if streaming ASR is unavailable.
fallback_model = "ggml-large-v3-turbo.bin"

[enhancement]
enabled = true
# "managed" uses the checksum-pinned llama.cpp runtime from setup.
command = "managed"
model = "Qwen_Qwen3.5-4B-Q4_K_M.gguf"
timeout_ms = 10000
