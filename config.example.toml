version = 2
language = "auto"

[audio]
# Empty uses the PipeWire default source.
device = ""
feedback = true

[delivery]
# Direct typing remains unpaced by default. Increase this only for applications
# that cannot keep up with virtual keyboard events.
typing_delay_ms = 0

[recognition]
# "sherpa-onnx" runs the managed streaming runtime installed by
# `whispers setup`. "whisper-cli" runs the external whisper.cpp CLI on the
# finished recording, with no streaming preview. Install whisper-cpp plus a GPU
# backend first (on Arch: `pacman -S whisper-cpp ggml-vulkan`); the plain
# `ggml` package is CPU only and makes large models unusably slow.
runtime = "sherpa-onnx"
# Low-latency text shown in the OSD while speaking (sherpa-onnx only).
model = "nemotron-3.5-asr-streaming-0.6b-560ms-int8"
# Multilingual full-recording pass used for delivered text (sherpa-onnx only).
final_model = "nemo-parakeet-tdt-0.6b-v3-int8"
# whisper.cpp model used by `whisper-cli` and as the managed ASR fallback.
fallback_model = "ggml-large-v3-turbo.bin"

[enhancement]
enabled = true
# "managed" uses the checksum-pinned llama.cpp runtime from setup.
command = "managed"
model = "Qwen_Qwen3.5-4B-Q4_K_M.gguf"
timeout_ms = 10000
