name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate tag
        env:
          TAG_NAME: ${{ github.event_name == 'push' && github.ref_name || inputs.tag_name }}
        run: |
          version=$(awk -F '"' '$1 ~ /^version *=/ { print $2; exit }' Cargo.toml)
          test "$TAG_NAME" = "v$version"
      - name: Build bundle
        run: scripts/build-release-bundle.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event_name == 'push' && github.ref_name || inputs.tag_name }}
        run: |
          gh release view "$TAG_NAME" >/dev/null 2>&1 || \
            gh release create "$TAG_NAME" --title "$TAG_NAME" --generate-notes
          gh release upload "$TAG_NAME" dist/* --clobber
