name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt-check
      - name: Lints
        run: cargo lint
      - name: Tests
        run: cargo qa
      - name: Build budget
        run: scripts/check-build-budget.sh
      - name: Package
        run: cargo package --locked
      - name: Release bundle
        run: scripts/build-release-bundle.sh
